{{- range .Values.workerPools }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "routecairn.fullname" $ }}-worker-{{ .name }}
  labels: { app.kubernetes.io/name: routecairn-worker, app.kubernetes.io/instance: {{ $.Release.Name }}, routecairn.io/network-zone: {{ .networkZone | quote }} }
spec:
  replicas: {{ .replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: routecairn-worker, app.kubernetes.io/instance: {{ $.Release.Name }}, routecairn.io/pool: {{ .name | quote }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: routecairn-worker, app.kubernetes.io/instance: {{ $.Release.Name }}, routecairn.io/pool: {{ .name | quote }}, routecairn.io/network-zone: {{ .networkZone | quote }} }
      annotations:
        routecairn.io/capabilities: {{ join "," .capabilities | quote }}
    spec:
      serviceAccountName: {{ include "routecairn.serviceAccountName" $ }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          args: ["agent","run","--state","/var/run/routecairn-agent/{{ .stateKey }}","--workspace","/var/lib/routecairn-worker"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - { name: state, mountPath: /var/run/routecairn-agent, readOnly: true }
            - { name: workload-identity, mountPath: /var/run/secrets/routecairn, readOnly: true }
            - { name: workspace, mountPath: /var/lib/routecairn-worker }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: state, secret: { secretName: {{ .enrollmentSecretName }}, defaultMode: 0400 } }
        - name: workload-identity
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken: { path: token, audience: {{ $.Values.workloadIdentity.audience | quote }}, expirationSeconds: 3600 }
        - { name: workspace, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
{{- end }}
