apiVersion: v1
kind: Service
metadata:
  name: {{ include "routecairn.fullname" . }}
  labels: {{- include "routecairn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
  selector: { app.kubernetes.io/name: routecairn, app.kubernetes.io/instance: {{ .Release.Name }} }
