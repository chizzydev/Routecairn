apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ include "routecairn.fullname" . }}-dashboard }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.dashboard.storageSize | quote }} } }
  {{- if .Values.dashboard.storageClassName }}
  storageClassName: {{ .Values.dashboard.storageClassName | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "routecairn.fullname" . }}-dashboard }
spec:
  type: ClusterIP
  ports: [{ name: http, port: 4711, targetPort: http }]
  selector: { app.kubernetes.io/name: routecairn-dashboard, app.kubernetes.io/instance: {{ .Release.Name }} }
