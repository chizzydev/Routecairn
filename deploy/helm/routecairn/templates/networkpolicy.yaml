{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ include "routecairn.fullname" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }, matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [routecairn, routecairn-dashboard] }] }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports: [{ protocol: TCP, port: 4711 }]
  egress:
    - to: [{ namespaceSelector: {} }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
  {{- range concat .Values.networkPolicy.postgresCidrs .Values.networkPolicy.objectStorageCidrs .Values.networkPolicy.otlpCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 5432 }, { protocol: TCP, port: 4318 }, { protocol: TCP, port: 9000 }]
  {{- end }}
{{- end }}
