image:
  repository: routecairn/routecairn
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3
revisionHistoryLimit: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 4711

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

postgres:
  secretName: routecairn-postgres
  urlKey: database-url
  poolSize: 12
  statementTimeoutMs: 30000
  tls:
    secretName: ""

objectStorage:
  bucket: ""
  region: us-east-1
  endpoint: ""
  pathStyle: false
  prefix: routecairn
  kmsKeyId: ""

keyManagement:
  masterKeyKmsKeyId: ""
  ciphertextSecretName: ""
  ciphertextSecretKey: master-key.ciphertext

secrets:
  name: routecairn-secrets
  sessionSecretKey: session-secret
  mutationCoordinatorSecretKey: mutation-coordinator-secret
  bootstrapOwnerPasswordKey: bootstrap-owner-password

publicOrigin: "https://routecairn.example.com"
bootstrapOwnerLogin: ""

workloadIdentity:
  required: false
  issuers: ""
  audience: routecairn-control-plane

telemetry:
  otlpEndpoint: "http://otel-collector.observability.svc:4318"
  serviceName: routecairn-control-plane

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  postgresCidrs: []
  objectStorageCidrs: []
  otlpCidrs: []

workerPools: []
# - name: private-us-east
#   replicas: 2
#   networkZone: private-us-east
#   capabilities: [scan, export, module, ping]
#   enrollmentSecretName: routecairn-worker-private-us-east
#   stateKey: agent-state.json
#   resources:
#     requests: { cpu: "1", memory: 1Gi }
#     limits: { cpu: "4", memory: 4Gi }

nodeSelector: {}
tolerations: []
affinity: {}
