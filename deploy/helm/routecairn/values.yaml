image:
  repository: routecairn/routecairn
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3
revisionHistoryLimit: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 4711

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

postgres:
  secretName: routecairn-postgres
  urlKey: database-url
  poolSize: 12
  statementTimeoutMs: 30000
  tls:
    secretName: ""

objectStorage:
  bucket: ""
  region: us-east-1
  endpoint: ""
  pathStyle: false
  prefix: routecairn
  kmsKeyId: ""
  encryption: AES256
  credentialsSecretName: ""
  accessKeyKey: access-key
  secretKeyKey: secret-key

keyManagement:
  masterKeyKmsKeyId: ""
  ciphertextSecretName: ""
  ciphertextSecretKey: master-key.ciphertext

secrets:
  name: routecairn-secrets
  sessionSecretKey: session-secret
  mutationCoordinatorSecretKey: mutation-coordinator-secret
  bootstrapOwnerPasswordKey: bootstrap-owner-password
  masterKeyKey: master-key

publicOrigin: "https://routecairn.example.com"
bootstrapOwnerLogin: ""

workloadIdentity:
  required: false
  issuers: ""
  audience: routecairn-control-plane

telemetry:
  otlpEndpoint: "http://otel-collector.observability.svc:4318"
  serviceName: routecairn-control-plane

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  postgresCidrs: []
  objectStorageCidrs: []
  otlpCidrs: []

workerPools: []
# Production pool example: one independent signing identity per worker.
# - name: private-zone
#   networkZone: private-zone
#   capabilities: [ping, scan]
#   resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
#   workers:
#     - { name: a, enrollmentSecretName: private-zone-a, stateKey: agent-state.json }
#     - { name: b, enrollmentSecretName: private-zone-b, stateKey: agent-state.json }

dashboard:
  storageSize: 10Gi
  storageClassName: ""
