services:
  control-plane:
    environment: &distributed-environment
      ROUTECAIRN_CONTROL_PLANE_MODE: distributed
      ROUTECAIRN_DATABASE_URL_FILE: /run/secrets/database-url
      ROUTECAIRN_EVIDENCE_S3_BUCKET: routecairn-evidence
      ROUTECAIRN_EVIDENCE_S3_ENDPOINT: http://object-storage:9000
      ROUTECAIRN_EVIDENCE_S3_PATH_STYLE: "true"
      ROUTECAIRN_EVIDENCE_S3_PREFIX: routecairn
      ROUTECAIRN_EVIDENCE_S3_ENCRYPTION: provider
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/object-storage-access-key
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/object-storage-secret-key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: routecairn-control-plane
    secrets:
      - database-url
      - object-storage-access-key
      - object-storage-secret-key
    depends_on:
      postgres: { condition: service_healthy }
      object-storage-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

  fleet:
    build: { context: ../.., dockerfile: deploy/control-plane/Dockerfile }
    restart: unless-stopped
    command: [fleet, --host, 0.0.0.0, --port, "4711", --trust-proxy]
    deploy: { replicas: 2 }
    environment: *distributed-environment
    secrets: [database-url, object-storage-access-key, object-storage-secret-key]
    networks: [control-plane]
    depends_on:
      postgres: { condition: service_healthy }
      object-storage-init: { condition: service_completed_successfully }

  caddy:
    volumes: [./Caddyfile.distributed:/etc/caddy/Caddyfile:ro]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: routecairn
      POSTGRES_USER: routecairn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [routecairn-postgres:/var/lib/postgresql/data]
    networks: [control-plane]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U routecairn -d routecairn"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-storage:
    image: routecairn/minio:07c3a429bfed
    build: { context: ../.., dockerfile: deploy/control-plane/Minio.Dockerfile }
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/object-storage-access-key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/object-storage-secret-key
    secrets: [object-storage-access-key, object-storage-secret-key]
    volumes: [routecairn-objects:/data]
    networks: [control-plane]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-storage-init:
    build: { context: ../.., dockerfile: deploy/control-plane/Dockerfile }
    restart: "no"
    depends_on: { object-storage: { condition: service_healthy } }
    command: [initialize-evidence-storage]
    environment:
      ROUTECAIRN_EVIDENCE_S3_BUCKET: routecairn-evidence
      ROUTECAIRN_EVIDENCE_S3_ENDPOINT: http://object-storage:9000
      ROUTECAIRN_EVIDENCE_S3_PATH_STYLE: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/object-storage-access-key
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/object-storage-secret-key
    secrets: [object-storage-access-key, object-storage-secret-key]
    networks: [control-plane]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    networks: [control-plane]

volumes:
  routecairn-postgres:
  routecairn-objects:

secrets:
  database-url: { file: ./secrets/database-url.txt }
  postgres-password: { file: ./secrets/postgres-password.txt }
  object-storage-access-key: { file: ./secrets/object-storage-access-key.txt }
  object-storage-secret-key: { file: ./secrets/object-storage-secret-key.txt }
