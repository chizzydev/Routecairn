name: RouteCairn continuous assurance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: routecairn-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Build core and dashboard
        run: npm run build && npm run dashboard:build
      - name: Full unit and integration suite
        run: npm test
      - name: Capability, migration, worker-fault, and browser-boundary gates
        run: npx vitest run tests/dashboard/admin/capability-parity.test.ts tests/dashboard/worker-governance.test.ts tests/dashboard/worker-governance-api.test.ts tests/unit/browser-network-boundary.test.ts tests/dashboard/dashboard-closure-workflows.test.ts

  browser-chromium:
    name: Chromium and connection-boundary acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run tests/unit/browser-crawler.test.ts tests/integration/browser-crawler.test.ts tests/unit/browser-network-boundary.test.ts

  assurance-gate:
    name: Required assurance gate
    if: always()
    needs: [cross-platform, browser-chromium]
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete assurance
        env:
          CROSS_PLATFORM: ${{ needs.cross-platform.result }}
          BROWSER: ${{ needs.browser-chromium.result }}
        run: test "$CROSS_PLATFORM" = success && test "$BROWSER" = success
