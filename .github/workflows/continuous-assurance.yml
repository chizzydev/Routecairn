name: RouteCairn continuous assurance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: routecairn-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Build core and dashboard
        run: npm run build && npm run dashboard:build
      - name: Platform boundary suite
        run: npx vitest run tests/unit/url-normalizer.test.ts tests/unit/scope.test.ts tests/unit/browser-network-boundary.test.ts --pool=forks --maxWorkers=1
      - name: Measured effectiveness gate
        run: node dist/cli/index.js benchmark local --repetitions 3 --baseline benchmarks/routecairn-comprehensive-detection-baseline.json --release "${{ github.ref_name }}" --build "${{ github.sha }}" --output .routecairn-benchmarks
      - name: Preserve measured-effectiveness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effectiveness-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-benchmarks/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Capability, migration, worker-fault, and browser-boundary gates
        run: npx vitest run tests/dashboard/admin/capability-parity.test.ts tests/dashboard/worker-governance.test.ts tests/dashboard/worker-governance-api.test.ts tests/unit/browser-network-boundary.test.ts tests/dashboard/dashboard-closure-workflows.test.ts

  quality:
    name: Static quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run standards:check
      - run: npm run dashboard:typecheck
      - run: npm run architecture:check
      - run: npm run release:verify
      - name: Coverage gate
        run: npm run test:coverage -- --pool=forks --maxWorkers=1
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: .routecairn-coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  test-shards:
    name: Test shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run isolated shard
        run: npm run test:ci -- --shard=${{ matrix.shard }} --testTimeout=180000 --hookTimeout=180000
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  mutation-safety:
    name: Critical safety mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - name: Preserve mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 30

  browser-chromium:
    name: Chromium and connection-boundary acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run tests/unit/browser-crawler.test.ts tests/integration/browser-crawler.test.ts tests/unit/browser-network-boundary.test.ts
      - name: Provider emulator, OIDC callback, and passkey acceptance
        run: npm run build && node dist/cli/index.js validate-authentication-fixtures --output .routecairn-authentication-acceptance
      - name: Preserve authentication-fixture acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authentication-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-authentication-acceptance/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: WebSocket, GraphQL, multipart, gRPC, HTTP/2, and native HTTP/3 acceptance
        run: node dist/cli/index.js validate-protocol-fixtures --output .routecairn-protocol-acceptance
      - name: Preserve protocol acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-protocol-acceptance/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  release-package:
    name: Published package acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, pack, install, and exercise the published artifact
        run: npm run package:smoke -- --pack-destination .routecairn-release/ci
      - name: Retain the verified candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-package-${{ github.sha }}
          path: .routecairn-release/ci/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  control-plane-image:
    name: Self-hosted control-plane image acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create ephemeral bootstrap secrets
        run: |
          mkdir -p deploy/control-plane/secrets
          openssl rand -hex 48 > deploy/control-plane/secrets/session-secret.txt
          openssl rand -hex 48 > deploy/control-plane/secrets/mutation-coordinator-secret.txt
          openssl rand -base64 48 > deploy/control-plane/secrets/bootstrap-owner-password.txt
      - name: Validate and start the release control plane
        working-directory: deploy/control-plane
        env:
          ROUTECAIRN_HOSTNAME: routecairn.example.test
          ROUTECAIRN_BOOTSTRAP_OWNER_LOGIN: ci-owner@example.test
        run: |
          docker compose config --quiet
          docker compose up --build --detach --wait control-plane
          docker compose exec -T control-plane node -e "fetch('http://127.0.0.1:4711/readyz').then(async response => { if (!response.ok || (await response.json()).status !== 'ready') process.exit(1) })"
      - name: Preserve control-plane logs
        if: always()
        working-directory: deploy/control-plane
        run: docker compose logs --no-color control-plane
      - name: Stop control plane
        if: always()
        working-directory: deploy/control-plane
        run: docker compose down --volumes --remove-orphans

  broader-acceptance:
    name: Eight-lane broader acceptance laboratory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and execute the complete broader-acceptance grid
        run: npm run build && node dist/cli/index.js validate-broader-local --output .routecairn-validation
      - name: Release-bound external attestation contract
        run: npx vitest run tests/integration/external-acceptance.test.ts
      - name: Preserve broader-acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: broader-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-validation/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  credibility-corpus:
    name: Public 576-case repeated detection scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build and execute the multi-language credibility corpus
        run: npm run build && node dist/cli/index.js benchmark credibility --python python3 --go go --repetitions 3 --baseline benchmarks/scorecards/2.0.0/reference-windows-node24/benchmark-result.json --release "${{ github.ref_name }}" --build "${{ github.sha }}" --output .routecairn-credibility
      - name: Preserve the versioned public scorecard and raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credibility-scorecard-${{ github.sha }}-${{ github.run_attempt }}
          path: .routecairn-credibility/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  native-oast:
    name: Native OAST / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install pinned isolated parser/template runtimes
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --target .routecairn-oast-lab/python Jinja2==3.1.6 MarkupSafe==3.0.3
      - name: Execute native TLS/DNS and active OAST runtime acceptance
        run: npm run acceptance:oast -- --python-path .routecairn-oast-lab/python --output .routecairn-oast-lab/evidence
      - name: Preserve native OAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-oast-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-oast-lab/evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  assurance-gate:
    name: Required assurance gate
    if: always()
    needs: [mutation-safety, quality, test-shards, cross-platform, browser-chromium, release-package, control-plane-image, broader-acceptance, credibility-corpus, native-oast, attack-graph, protocol-semantics, module-ecosystem, module-container, scale-native, scale-kubernetes]
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete assurance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.NEEDS_JSON); const failed=Object.entries(jobs).filter(([,job])=>job.result!=="success"); if(failed.length){console.error(failed.map(([name,job])=>name+": "+job.result).join("\n"));process.exit(1);}'

  protocol-semantics:
    name: Native protocol and intermediary acceptance
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download committed native proxy versions and verify archive hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $PWD '.routecairn-protocol-lab/tools'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          $archives = @(
            @{ Name='caddy'; Url='https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_windows_amd64.zip'; Sha256='1708333f79e274c7697285afe6d592ab39314e0b131e9ec6bea08ad27df62ebf' },
            @{ Name='nginx'; Url='https://nginx.org/download/nginx-1.31.6.zip'; Sha256='bb65edcfc22a2214a4afaac59f038f560c02b98d4b49c5dca1206d3cc5d631c9' }
          )
          foreach ($archive in $archives) {
            $zip = Join-Path $tools ($archive.Name + '.zip')
            Invoke-WebRequest -Uri $archive.Url -OutFile $zip
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $archive.Sha256) { throw 'Native archive checksum mismatch.' }
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $tools $archive.Name)
          }
          "ROUTECAIRN_CADDY_BINARY=$(Join-Path $tools 'caddy/caddy.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ROUTECAIRN_NGINX_BINARY=$(Join-Path $tools 'nginx/nginx-1.31.6/nginx.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run module, native datagram and real intermediary acceptance
        run: npm run acceptance:protocol-semantics -- --output .routecairn-protocol-lab/ci
      - name: Preserve protocol deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-semantics-${{ github.sha }}-${{ github.run_attempt }}
          path: .routecairn-protocol-lab/ci/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  attack-graph:
    name: Attack graph / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build && npm run dashboard:build
      - name: Graph, compiler, approval, runtime cleanup and UI gate
        run: npm run acceptance:attack-graph -- --output .routecairn-attack-graph-lab/ci
      - name: Preserve attack graph operational evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attack-graph-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-attack-graph-lab/ci/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  module-ecosystem:
    name: Module ecosystem / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run acceptance:modules -- --output .routecairn-module-lab/ci
      - name: Retain signed distribution and execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: module-ecosystem-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-module-lab/ci/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  module-container:
    name: Network-isolated module execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve official Node runtime to an immutable container digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:24.13.0-bookworm-slim
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' node:24.13.0-bookworm-slim)
          [[ "$image" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "ROUTECAIRN_MODULE_CONTAINER_IMAGE=$image" >> "$GITHUB_ENV"
      - run: npm run acceptance:modules -- --output .routecairn-module-lab/container-ci
      - name: Preserve container runtime proof and digest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: module-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-module-lab/container-ci/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  scale-native:
    name: Live PostgreSQL / MinIO / KMS SDK / identities
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install checksum-pinned native services and source-built MinIO
        shell: pwsh
        run: ./scripts/setup-scale-lab.ps1
      - run: npm run build:release
      - run: npm run acceptance:scale -- --output .routecairn-scale-lab/ci-native
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scale-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: .routecairn-scale-lab/ci-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  scale-kubernetes:
    name: Actual Helm fleet and zone-bound worker pods
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install verified pinned kind and Helm tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .routecairn-scale-lab/tools
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64 -o .routecairn-scale-lab/tools/kind
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64.sha256sum | sed 's/kind-linux-amd64/.routecairn-scale-lab\/tools\/kind/' | sha256sum --check
          chmod +x .routecairn-scale-lab/tools/kind
          curl -fsSL https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz -o .routecairn-scale-lab/tools/helm.tar.gz
          expected=$(curl -fsSL https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz.sha256sum | cut -d ' ' -f 1)
          echo "$expected  .routecairn-scale-lab/tools/helm.tar.gz" | sha256sum --check
          tar -xzf .routecairn-scale-lab/tools/helm.tar.gz -C .routecairn-scale-lab/tools
          echo "$PWD/.routecairn-scale-lab/tools/linux-amd64" >> "$GITHUB_PATH"
      - name: Build the release and pinned MinIO source image
        run: |
          npm run build:release
          docker build -f deploy/control-plane/Dockerfile -t routecairn/scale-lab:ci .
          docker build -f deploy/control-plane/Minio.Dockerfile -t routecairn/minio:07c3a429bfed .
      - name: Create an isolated cluster and preload images
        run: |
          .routecairn-scale-lab/tools/kind create cluster --name routecairn-scale-ci --kubeconfig .routecairn-scale-lab/kubeconfig --wait 120s
          kubectl --kubeconfig .routecairn-scale-lab/kubeconfig config rename-context kind-routecairn-scale-ci routecairn-scale-ci
          .routecairn-scale-lab/tools/kind load docker-image --name routecairn-scale-ci routecairn/scale-lab:ci routecairn/minio:07c3a429bfed
      - name: Run chart deployment and cleanup acceptance
